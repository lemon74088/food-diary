<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f5f0">
<title>我的食物日記</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#242922;--muted:#73796f;--line:#e6e7df;--green:#536b4f;--green2:#eaf0e6;--sand:#f4eee3;--danger:#a5483e;--radius:20px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:0 auto;padding:18px 15px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 20px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--green);font-weight:750}.brand{font-size:25px;letter-spacing:-.04em;font-weight:800;margin:2px 0}.sub{font-size:13px;color:var(--muted)}.iconbtn{background:white;border:1px solid var(--line);border-radius:13px;padding:10px 12px;color:var(--ink)}.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:15px;gap:8px}.datebar button{background:var(--green2);color:var(--green);border-radius:12px;padding:10px 14px;font-weight:700}.datecenter{text-align:center;min-width:0}.datecenter strong{display:block;font-size:15px}.datecenter span{font-size:12px;color:var(--muted)}.tabs{display:flex;background:#eae9e2;border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}.tab{flex:1;background:transparent;padding:10px 4px;border-radius:11px;color:#697065;font-weight:700;font-size:14px}.tab.active{background:white;color:var(--ink);box-shadow:0 1px 4px #0000000c}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.sectionhead h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}.mealhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.mealname{font-weight:800;font-size:16px}.meta{color:var(--muted);font-size:12px}.mealphoto{width:100%;max-height:300px;object-fit:cover;border-radius:14px;margin-top:12px;background:#f2f1eb}.foodtitle{font-weight:750;margin:10px 0 2px}.notes{font-size:14px;color:#5c6259;white-space:pre-wrap;overflow-wrap:anywhere}.small-actions{display:flex;gap:8px;margin-top:12px}.small-actions button{background:#f3f3ee;padding:8px 12px;border-radius:10px;font-size:13px;color:#4e554b}.small-actions .delete{color:var(--danger)}.empty{padding:28px 16px;text-align:center;color:var(--muted);background:#ffffff8a;border:1px dashed #d8dbd0;border-radius:18px}.empty .emoji{font-size:28px;margin-bottom:5px}.primary{background:var(--green);color:white;border-radius:14px;padding:13px 16px;font-weight:800}.secondary{background:var(--green2);color:var(--green);border-radius:14px;padding:12px 14px;font-weight:750}.addrow{display:flex;gap:10px;margin:12px 0}.addrow button{flex:1}.eventtime{display:inline-block;border-radius:8px;background:var(--sand);color:#7a6549;padding:4px 8px;font-size:12px;font-weight:750;margin-bottom:8px}.eventtext{white-space:pre-wrap;overflow-wrap:anywhere}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-size:13px;font-weight:750;color:#4f564d}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink);outline-color:#879b7f}.field textarea{min-height:80px;resize:vertical}.photo-pick{display:flex;gap:10px}.photo-pick label{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:var(--green2);color:var(--green);border-radius:12px;padding:12px;font-weight:750;font-size:14px}.photo-pick input{display:none}.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:10px}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:#1b211ba8;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:var(--bg);border-radius:24px 24px 18px 18px;padding:20px;width:min(100%,650px);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{font-size:20px;margin:0}.close{background:#e9e9e2;border-radius:10px;padding:8px 11px}.modalfoot{display:flex;gap:10px;margin-top:8px}.modalfoot button{flex:1}.pillrow{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 13px;color:#555d52}.pill.selected{border-color:var(--green);background:var(--green2);color:var(--green);font-weight:800}.reportbox{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.reportbox h3{font-size:16px;margin:0 0 8px}.reportbox p,.reportbox li{font-size:14px;color:#555d52}.hint{font-size:12px;color:var(--muted);line-height:1.55}.footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263126;color:white;padding:11px 16px;border-radius:12px;z-index:20;box-shadow:0 8px 24px #0002;font-size:14px;max-width:90%;text-align:center}.navbottom{position:fixed;bottom:0;left:0;right:0;padding:10px 15px calc(10px + env(safe-area-inset-bottom));background:#f6f5f0ed;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}.navinner{max-width:760px;margin:auto;display:flex;gap:10px}.navinner button{flex:1}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f4f4ee;border-radius:13px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
@media(min-width:600px){.app{padding-top:26px}.modalback{align-items:center}.modal{border-radius:24px}.mealphoto{max-height:380px}}

/* Visual refresh: refined cards, clearer hierarchy, and thumb-friendly controls */
:root{--bg:#f7f6f1;--card:#fff;--ink:#20271f;--muted:#777e73;--line:#e5e7de;--green:#526b4f;--green2:#edf2e9;--radius:23px}
body{line-height:1.58;background:linear-gradient(180deg,#f8f7f2 0%,#f3f2eb 100%)}
.app{max-width:780px;padding:24px 18px 118px}
.top{align-items:center;margin:8px 0 24px;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.18em}
.brand{font-size:clamp(27px,5vw,34px);letter-spacing:-.035em;margin:5px 0}
.sub{font-size:15px}
.iconbtn{font-weight:750;padding:13px 16px;border-radius:17px;box-shadow:0 4px 14px #283b2510;white-space:nowrap}
.datebar{border-radius:24px;padding:12px;margin-bottom:18px;box-shadow:0 5px 18px #283b2508}
.datebar button{min-width:48px;min-height:48px;border-radius:16px;font-size:18px}
.datecenter strong{font-size:clamp(16px,3.8vw,21px)}
.datecenter span{font-size:13px}
.tabs{background:#eae9e2;border-radius:19px;padding:5px;gap:5px;margin-bottom:22px}
.tab{padding:13px 5px;border-radius:15px;font-size:14px;min-height:52px;transition:background .15s ease}
.tab.active{background:var(--green);color:#fff;box-shadow:0 4px 12px #526b4f25}
.tab-icon{display:inline-block;margin-right:3px;font-size:15px}
.sectionhead{margin:22px 3px 13px}
.sectionhead h2{font-size:21px;letter-spacing:-.02em}
.count{font-size:13px}
.card{border-radius:24px;padding:19px;box-shadow:0 4px 18px #283b2505}
.empty{padding:38px 18px;border-radius:23px;background:#fffdf9;border-color:#dfe3d8}
.empty .emoji{font-size:38px;margin-bottom:10px}
.empty b{font-size:17px;color:var(--ink)}
.empty .hint{font-size:14px;margin-top:5px}
.primary,.secondary{min-height:52px;border-radius:17px;font-size:15px;transition:transform .12s ease,filter .12s ease}
.primary{box-shadow:0 5px 12px #526b4f16}
.primary:active,.secondary:active,.datebar button:active{transform:scale(.985)}
.addrow{gap:12px;margin:15px 0}
.addrow button{padding:15px 10px}
.hint{font-size:13px;line-height:1.7}
.footer-note{font-size:12px;line-height:1.9;margin:28px 0 8px;padding-top:17px;border-top:1px solid #e7e8e0}
.signature{font-size:12px;letter-spacing:.04em;color:#697563;margin-top:5px;font-weight:700}
.navbottom{padding:11px 18px calc(12px + env(safe-area-inset-bottom));background:#f7f6f1ed}
.navinner{gap:12px}
.navinner button{min-height:54px;border-radius:18px;font-size:15px}
.reportbox{border-radius:22px;box-shadow:0 4px 18px #283b2505}
@media(max-width:390px){.app{padding:18px 13px 115px}.top{gap:8px}.brand{font-size:25px}.iconbtn{font-size:13px;padding:11px 10px}.datebar{gap:5px;padding:8px}.datebar button{min-width:40px;min-height:44px;padding:8px 10px}.tab{font-size:12px}.tab-icon{display:none}.addrow{gap:8px}.addrow button{font-size:14px}}
</style></head>
<body><main class="app">
<header class="top"><div><div class="eyebrow">FOOD · BODY · NOTES</div><div class="brand">我的食物日記</div><div class="sub">先好好記錄，之後再一起回看。</div></div><button class="iconbtn" id="settingsBtn" aria-label="資料與備份">資料備份</button></header>
<div class="datebar"><button id="prevDay" aria-label="前一天">‹</button><div class="datecenter"><strong id="dateLabel"></strong><span id="weekdayLabel"></span></div><button id="todayBtn">今天</button><button id="nextDay" aria-label="後一天">›</button></div>
<div class="tabs"><button class="tab active" data-tab="food"><span class="tab-icon">✦</span> 飲食</button><button class="tab" data-tab="events"><span class="tab-icon">♧</span> 身體事件</button><button class="tab" data-tab="review"><span class="tab-icon">▤</span> 階段整合</button></div>
<section id="foodView"><div class="sectionhead"><h2>今天吃了什麼</h2><span class="count" id="mealCount">0 筆記錄</span></div><div id="mealList"></div><div class="addrow"><button class="primary" id="addMealBtn">＋ 記一餐</button><button class="secondary" id="addSnackBtn">＋ 點心／飲品</button></div><div class="hint">拍照或選擇相片，再簡單寫下吃了什麼。照片與文字保存在這台裝置的瀏覽器中。</div></section>
<section id="eventsView" class="hidden"><div class="sectionhead"><h2>身體事件</h2><span class="count" id="eventCount">0 筆記錄</span></div><div class="card"><div class="hint" style="margin-bottom:12px">不舒服或有特別感受時，記下大概時段和一句描述就好。</div><button class="primary" style="width:100%" id="addEventBtn">＋ 記下身體狀況</button></div><div id="eventList"></div></section>
<section id="reviewView" class="hidden"><div class="sectionhead"><h2>7–14 天階段整合</h2></div><div class="card"><div class="field"><label>開始日期</label><input type="date" id="rangeStart"></div><div class="field"><label>結束日期</label><input type="date" id="rangeEnd"></div><div class="hint" style="margin-bottom:12px">選擇一段日期，查看記錄概況並匯出給自己的醫生。這份摘要不會自行診斷疾病或體質。</div><button class="primary" style="width:100%" id="buildReport">整理這段資料</button></div><div id="reportResult"></div></section>
<div class="footer-note"><div>本機日記 · 不需帳號 · 請定期備份重要資料</div><div class="signature">陳佳宏製作 · 2026年10月29日</div></div>
</main>
<div class="navbottom"><div class="navinner"><button class="secondary" id="quickEvent">＋ 身體事件</button><button class="primary" id="quickMeal">＋ 記一餐</button></div></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);const DB_NAME='food-diary-local-v1',DB_VERSION=1;let db=null,currentDate=localDate(new Date()),activeTab='food',editingMeal=null,editingEvent=null,photoData=null;
function localDate(d){let x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)}
function shiftDate(s,n){let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function fmtDate(s){if(!s)return '';let d=new Date(s+'T12:00:00');return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function weekday(s){return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][new Date(s+'T12:00:00').getDay()]}
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{let d=req.result;if(!d.objectStoreNames.contains('meals'))d.createObjectStore('meals',{keyPath:'id'});if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'id'});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function reqp(req){return new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
async function all(name){return reqp(store(name).getAll())}async function put(name,item){return reqp(store(name,'readwrite').put(item))}async function del(name,id){return reqp(store(name,'readwrite').delete(id))}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setTab(tab){activeTab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('foodView').classList.toggle('hidden',tab!=='food');$('eventsView').classList.toggle('hidden',tab!=='events');$('reviewView').classList.toggle('hidden',tab!=='review');document.querySelector('.navbottom').classList.toggle('hidden',tab==='review')}
function renderDate(){$('dateLabel').textContent=fmtDate(currentDate);$('weekdayLabel').textContent=weekday(currentDate);renderMeals();renderEvents()}
async function renderMeals(){let meals=(await all('meals')).filter(m=>m.date===currentDate).sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));$('mealCount').textContent=`${meals.length} 筆記錄`;let root=$('mealList');if(!meals.length){root.innerHTML='<div class="empty"><div class="emoji">🍚</div><b>今天還沒有飲食記錄</b><div class="hint">吃完再記也可以，不用一次寫得很完整。</div></div>';return}root.innerHTML=meals.map(m=>`<article class="card"><div class="mealhead"><div><div class="mealname">${esc(m.mealType||'餐點')}</div><div class="meta">${esc(m.timeLabel||'')} ${m.foodName?'· '+esc(m.foodName):''}</div></div><span class="meta">${m.photos?.length?'📷 '+m.photos.length+' 張':''}</span></div>${(m.photos||[]).map(src=>`<img class="mealphoto" src="${src}" alt="食物照片" loading="lazy">`).join('')} ${m.notes?`<div class="notes" style="margin-top:10px">${esc(m.notes)}</div>`:''}<div class="small-actions"><button data-edit-meal="${m.id}">編輯</button><button class="delete" data-delete-meal="${m.id}">刪除</button></div></article>`).join('');root.querySelectorAll('[data-edit-meal]').forEach(b=>b.onclick=()=>openMeal(b.dataset.editMeal));root.querySelectorAll('[data-delete-meal]').forEach(b=>b.onclick=async()=>{if(confirm('確定刪除這筆飲食記錄？')){await del('meals',b.dataset.deleteMeal);renderMeals();toast('已刪除')}})}
async function renderEvents(){let events=(await all('events')).filter(e=>e.date===currentDate).sort((a,b)=>a.period.localeCompare(b.period));$('eventCount').textContent=`${events.length} 筆記錄`;let root=$('eventList');if(!events.length){root.innerHTML='<div class="empty"><div class="emoji">🌿</div><b>今天還沒有身體事件</b><div class="hint">有需要時再記，沒有也沒關係。</div></div>';return}let order={'上午':0,'中午':1,'下午':2,'晚上':3};events.sort((a,b)=>order[a.period]-order[b.period]);root.innerHTML=events.map(e=>`<article class="card"><span class="eventtime">${esc(e.period)}</span><div class="eventtext">${esc(e.description)}</div><div class="small-actions"><button data-edit-event="${e.id}">編輯</button><button class="delete" data-delete-event="${e.id}">刪除</button></div></article>`).join('');root.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>openEvent(b.dataset.editEvent));root.querySelectorAll('[data-delete-event]').forEach(b=>b.onclick=async()=>{if(confirm('確定刪除這筆事件？')){await del('events',b.dataset.deleteEvent);renderEvents();toast('已刪除')}})}
function showModal(title,content,onReady){$('modalRoot').innerHTML=`<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" id="closeModal">✕</button></div>${content}</div></div>`;$('closeModal').onclick=closeModal;$('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});if(onReady)onReady()}
function closeModal(){$('modalRoot').innerHTML='';editingMeal=null;editingEvent=null;photoData=null}
function openMeal(mealId=null,defaultType='午餐'){editingMeal=mealId;photoData=null;all('meals').then(ms=>{let m=ms.find(x=>x.id===mealId)||{date:currentDate,mealType:defaultType,timeLabel:'',foodName:'',notes:'',photos:[]};photoData=m.photos||[];showModal(mealId?'編輯飲食記錄':'記一餐',`<form id="mealForm"><div class="formgrid"><div class="field"><label>日期</label><input type="date" id="mDate" value="${esc(m.date)}" required></div><div class="field"><label>餐別</label><select id="mType">${['早餐','午餐','晚餐','點心／飲品'].map(t=>`<option ${m.mealType===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>吃了什麼？</label><input id="mName" placeholder="例如：排骨湯、青菜、白飯" value="${esc(m.foodName)}"></div><div class="field"><label>照片（可選）</label><div class="photo-pick"><label>📷 拍照<input id="cameraInput" type="file" accept="image/*" capture="environment"></label><label>🖼️ 選相片<input id="galleryInput" type="file" accept="image/*" multiple></label></div><div id="photoPreview"></div><div class="hint">第一版先保存照片，不會自動呼叫 AI 辨識，也不會產生 AI API 費用。</div></div><div class="field"><label>補充備註（可選）</label><textarea id="mNotes" placeholder="例如：吃得比較少、自己煮的、喝了冰飲">${esc(m.notes)}</textarea></div><div class="modalfoot"><button type="button" class="secondary" id="cancelMeal">取消</button><button class="primary" type="submit">保存記錄</button></div></form>`,()=>{let renderPreview=()=>{$('photoPreview').innerHTML=photoData.map((src,i)=>`<div style="display:inline-block;position:relative;width:86px;margin:8px 8px 0 0"><img src="${src}" style="width:86px;height:86px;object-fit:cover;border-radius:10px"><button type="button" data-rm-photo="${i}" style="position:absolute;top:3px;right:3px;border-radius:50%;background:#222b;color:white;width:24px;height:24px">×</button></div>`).join('');$('photoPreview').querySelectorAll('[data-rm-photo]').forEach(b=>b.onclick=()=>{photoData.splice(+b.dataset.rmPhoto,1);renderPreview()})};renderPreview();async function addFiles(files){for(let file of files){if(!file.type.startsWith('image/'))continue;try{let data=await compressImage(file);photoData.push(data)}catch{toast('有照片無法讀取')}}renderPreview()}$('cameraInput').onchange=e=>addFiles(e.target.files);$('galleryInput').onchange=e=>addFiles(e.target.files);$('cancelMeal').onclick=closeModal;$('mealForm').onsubmit=async e=>{e.preventDefault();let date=$('mDate').value;if(!date){toast('請選擇日期');return}let obj={id:mealId||id(),date,mealType:$('mType').value,timeLabel:'',foodName:$('mName').value.trim(),notes:$('mNotes').value.trim(),photos:photoData,createdAt:mealId?m.createdAt||new Date().toISOString():new Date().toISOString(),updatedAt:new Date().toISOString()};try{await put('meals',obj);currentDate=date;closeModal();renderDate();toast('已保存飲食記錄')}catch(err){toast('保存失敗，可能是裝置儲存空間不足')}}})})}
function compressImage(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let max=1500,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};img.src=reader.result};reader.readAsDataURL(file)})}
function openEvent(eventId=null){editingEvent=eventId;all('events').then(es=>{let e=es.find(x=>x.id===eventId)||{date:currentDate,period:'上午',description:''};showModal(eventId?'編輯身體事件':'記下身體狀況',`<form id="eventForm"><div class="field"><label>日期</label><input type="date" id="eDate" value="${esc(e.date)}" required></div><div class="field"><label>大概時間</label><div class="pillrow">${['上午','中午','下午','晚上'].map(p=>`<button type="button" class="pill ${e.period===p?'selected':''}" data-period="${p}">${p}</button>`).join('')}</div><input type="hidden" id="ePeriod" value="${esc(e.period)}"></div><div class="field"><label>發生什麼事？</label><textarea id="eDesc" placeholder="例如：今天覺得胃脹、一直怕冷、下午特別疲倦" required>${esc(e.description)}</textarea></div><div class="modalfoot"><button type="button" class="secondary" id="cancelEvent">取消</button><button type="submit" class="primary">保存記錄</button></div></form>`,()=>{document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-period]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('ePeriod').value=b.dataset.period});$('cancelEvent').onclick=closeModal;$('eventForm').onsubmit=async ev=>{ev.preventDefault();let date=$('eDate').value,description=$('eDesc').value.trim();if(!description){toast('寫一句簡單描述就好');return}let obj={id:eventId||id(),date,period:$('ePeriod').value,description,createdAt:eventId?e.createdAt||new Date().toISOString():new Date().toISOString(),updatedAt:new Date().toISOString()};await put('events',obj);currentDate=date;closeModal();renderDate();setTab('events');toast('已保存身體事件')}})})}
function toDataObject(){return Promise.all([all('meals'),all('events')]).then(([meals,events])=>({app:'我的食物日記',schemaVersion:1,exportedAt:new Date().toISOString(),meals,events}))}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function openBackup(){showModal('資料備份與還原',`<div class="reportbox"><h3>匯出完整備份</h3><p>包含飲食文字、身體事件和照片。請把備份檔保存在安全的位置。</p><button class="primary" style="width:100%" id="exportBackup">匯出完整備份（JSON）</button></div><div class="reportbox"><h3>還原備份</h3><p>選擇先前匯出的 JSON 檔。匯入會合併資料；相同記錄 ID 將以備份內容更新。</p><label class="secondary" style="display:block;text-align:center;cursor:pointer">選擇備份檔<input id="importBackup" type="file" accept=".json,application/json" style="display:none"></label></div><div class="hint">資料只保存在目前瀏覽器中。清除網站資料、換瀏覽器或換手機，都可能導致資料遺失；請定期匯出備份。</div>`,()=>{$('exportBackup').onclick=async()=>{let data=await toDataObject();downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),`我的食物日記備份_${localDate(new Date())}.json`);toast('已開始匯出備份')};$('importBackup').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.meals)||!Array.isArray(obj.events))throw Error('格式不符');if(!confirm(`備份中有 ${obj.meals.length} 筆飲食、${obj.events.length} 筆身體事件。匯入並合併到目前資料？`))return;for(let m of obj.meals){if(!m.id||!m.date)continue;await put('meals',m)}for(let v of obj.events){if(!v.id||!v.date)continue;await put('events',v)}closeModal();renderDate();toast('備份還原完成')}catch(err){toast('無法讀取此備份檔，原有資料未被清除')}}})}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)+1}
function makeSummaryDoc(body,start,end){
 return `<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>飲食與身體事件摘要</title><style>body{font:16px/1.7 -apple-system,sans-serif;max-width:800px;margin:24px auto;padding:0 16px;color:#242922}.reportbox{border:1px solid #ddd;border-radius:14px;padding:16px;margin:14px 0}.statrow{display:flex;gap:10px}.stat{background:#f2f3ec;padding:12px;border-radius:10px;flex:1}.stat b{display:block;font-size:22px}.hint{color:#666;font-size:13px}</style><h1>飲食與身體事件摘要</h1><p>記錄期間：${fmtDate(start)} 至 ${fmtDate(end)}</p>${body}</html>`;
}
async function shareDoctorFiles(summaryDoc,backupData,start,end){
 const summaryFile=new File([summaryDoc],`飲食與身體事件摘要_${start}_${end}.html`,{type:'text/html;charset=utf-8'});
 const backupFile=new File([JSON.stringify(backupData)],`日記資料_${start}_${end}.json`,{type:'application/json'});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[summaryFile,backupFile]})){
  try{
   await navigator.share({files:[summaryFile,backupFile],title:'飲食與身體事件記錄',text:`請查閱附件：醫師閱讀摘要及含照片的完整記錄（${start} 至 ${end}）。`});
   toast('已開啟分享選單，請選擇「郵件」並確認寄送');
   return;
  }catch(err){if(err&&err.name==='AbortError')return;}
 }
 downloadBlob(new Blob([summaryDoc],{type:'text/html;charset=utf-8'}),summaryFile.name);
 downloadBlob(new Blob([JSON.stringify(backupData)],{type:'application/json'}),backupFile.name);
 toast('此瀏覽器未支援直接分享附件，已改為匯出兩個檔案');
}
async function buildReport(){
 let start=$('rangeStart').value,end=$('rangeEnd').value;
 if(!start||!end||start>end){toast('請確認日期範圍');return}
 let days=dayDiff(start,end);
 if(days>31&&!confirm('這段日期超過 31 天，仍要整理嗎？'))return;
 let [meals,events]=await Promise.all([all('meals'),all('events')]);
 meals=meals.filter(x=>x.date>=start&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
 events=events.filter(x=>x.date>=start&&x.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
 let countByType={};meals.forEach(m=>countByType[m.mealType]=(countByType[m.mealType]||0)+1);
 let html=`<div class="reportbox" id="reportPrintable"><h3>階段記錄摘要</h3><p>${fmtDate(start)} 至 ${fmtDate(end)}（${days} 天）</p><div class="statrow"><div class="stat"><b>${meals.length}</b><span>飲食記錄</span></div><div class="stat"><b>${events.length}</b><span>身體事件</span></div><div class="stat"><b>${meals.reduce((n,m)=>n+(m.photos?.length||0),0)}</b><span>照片數</span></div></div><p><b>餐別記錄數：</b>${Object.keys(countByType).length?Object.entries(countByType).map(([k,v])=>`${esc(k)} ${v} 筆`).join('、'):'尚無記錄'}</p><p class="hint">此摘要只整理已記錄的內容，不代表醫療診斷，也不會僅依食物紀錄判定中醫體質。</p></div><div class="reportbox"><h3>飲食時間軸</h3>${meals.length?meals.map(m=>`<p><b>${esc(m.date)} · ${esc(m.mealType)}</b>${m.foodName?' — '+esc(m.foodName):''}${m.notes?'；'+esc(m.notes):''}${m.photos?.length?`（${m.photos.length} 張照片已包含於完整備份）`:''}</p>`).join(''):'<p>這段期間沒有飲食記錄。</p>'}</div><div class="reportbox"><h3>身體事件時間軸</h3>${events.length?events.map(v=>`<p><b>${esc(v.date)} · ${esc(v.period)}</b> — ${esc(v.description)}</p>`).join(''):'<p>這段期間沒有身體事件記錄。</p>'}</div><div class="addrow"><button class="primary" id="shareDoctor">一鍵寄送給醫師（摘要＋照片資料）</button><button class="secondary" id="exportSummary">匯出醫生閱讀摘要（HTML）</button><button class="secondary" id="exportRangeBackup">匯出完整資料（含照片）</button></div>`;
 $('reportResult').innerHTML=html;
 const summaryBody=()=>$('reportResult').innerHTML.replace(/<div class="addrow">[\s\S]*?<\/div>$/,'');
 const makeBackup=async()=>{
  let data=await toDataObject();
  data.meals=data.meals.filter(x=>x.date>=start&&x.date<=end);
  data.events=data.events.filter(x=>x.date>=start&&x.date<=end);
  return data;
 };
 $('exportSummary').onclick=()=>{
  let doc=makeSummaryDoc(summaryBody(),start,end);
  downloadBlob(new Blob([doc],{type:'text/html;charset=utf-8'}),`飲食與身體事件摘要_${start}_${end}.html`);
 };
 $('exportRangeBackup').onclick=async()=>{
  let data=await makeBackup();
  downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),`日記資料_${start}_${end}.json`);
 };
 $('shareDoctor').onclick=async()=>{
  try{
   let data=await makeBackup();
   let doc=makeSummaryDoc(summaryBody(),start,end);
   await shareDoctorFiles(doc,data,start,end);
  }catch(err){toast('產生附件失敗，請稍後再試');}
 };
}
$('prevDay').onclick=()=>{currentDate=shiftDate(currentDate,-1);renderDate()};$('nextDay').onclick=()=>{currentDate=shiftDate(currentDate,1);renderDate()};$('todayBtn').onclick=()=>{currentDate=localDate(new Date());renderDate()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('addMealBtn').onclick=()=>openMeal();$('addSnackBtn').onclick=()=>openMeal(null,'點心／飲品');$('quickMeal').onclick=()=>openMeal();$('addEventBtn').onclick=()=>openEvent();$('quickEvent').onclick=()=>{setTab('events');openEvent()};$('settingsBtn').onclick=openBackup;$('buildReport').onclick=buildReport;
(async()=>{try{if(!('indexedDB'in window))throw Error('no indexedDB');db=await openDB();$('rangeEnd').value=currentDate;$('rangeStart').value=shiftDate(currentDate,-6);renderDate()}catch(e){document.querySelector('.app').insertAdjacentHTML('afterbegin','<div class="card" style="border-color:#d99">此瀏覽器無法啟用本機資料儲存。請改用 Safari 或 Chrome 開啟，並避免使用無痕模式。</div>')}})();
})();
</script></body></html>
